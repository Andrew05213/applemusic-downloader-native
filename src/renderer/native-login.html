<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; style-src 'self'; script-src 'self'"><title>登录 Apple Music</title><link rel="stylesheet" href="native.css"><link rel="stylesheet" href="native-motion.css"></head>
<body class="login-page"><main class="login-content"><img class="music-mark" src="../assets/app-icon.png" alt="" width="48" height="48"><h1>登录 Apple Music</h1><p id="login-status" role="status">正在确认登录会话…</p>
<form id="login-form"><div id="account-fields"><label>Apple 账户<input id="login-email" type="text" autocomplete="username" maxlength="512" required></label><label>密码<input id="login-password" type="password" autocomplete="current-password" maxlength="4096" required></label></div><label id="code-field" hidden>验证码<input id="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></label><button id="login-submit" class="primary" type="submit">登录</button></form>
<section id="auth-interaction" hidden aria-live="polite"><h2 id="interaction-title"></h2><p id="interaction-message" class="interaction-message"></p><p id="interaction-note"></p><details id="interaction-original" hidden><summary>查看 Apple 原始提示</summary><p id="interaction-original-text" class="interaction-message"></p></details><form id="interaction-form"><div id="interaction-fields"></div><div id="interaction-buttons" class="interaction-buttons"></div></form><p id="interaction-error" class="error" role="alert"></p><p id="interaction-expiry" class="muted"></p></section>
<details id="two-factor-help" class="verification-help" hidden><summary>收不到设备验证码？</summary><div class="verification-help-content"><p>在已登录同一 Apple 账户的受信任设备上批准本次登录，查看六位验证码。</p><p>仅填写本次登录的验证码，不要使用其他登录会话的验证码。</p></div></details>
<div class="login-actions"><button id="login-recheck" type="button">重新验证会话</button><button id="login-cancel" type="button">暂不登录</button></div><p id="login-error" class="error" role="alert"></p></main><script src="native-motion.js"></script><script src="native-account-input.js"></script><script src="native-login.js"></script><script src="native-auth-presentation.js"></script><script src="native-auth-interaction.js"></script></body></html>
