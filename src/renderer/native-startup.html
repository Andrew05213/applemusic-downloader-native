<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'">
  <title>Apple Music Downloader</title>
  <link rel="stylesheet" href="native-startup.css">
</head>
<body data-phase="loading">
  <main aria-label="正在启动 Apple Music Downloader">
    <img id="startup-logo" src="../assets/app-icon.png" width="48" height="48" alt="">
    <section id="startup-error" role="status" hidden>
      <p id="startup-message">启动暂未完成，可以进入应用查看状态。</p>
      <div><button id="startup-enter" type="button">进入应用</button><button id="startup-quit" type="button">退出</button></div>
    </section>
  </main>
  <script src="native-startup.js"></script>
</body>
</html>
