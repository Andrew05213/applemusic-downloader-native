<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; img-src 'self' data: amdl-artwork: https://*.mzstatic.com; media-src blob: http://127.0.0.1:* https://*.mzstatic.com https://audio-ssl.itunes.apple.com; style-src 'self'; script-src 'self'"><title>Music</title><link rel="stylesheet" href="native.css"><link rel="stylesheet" href="native-shell.css"><link rel="stylesheet" href="native-motion.css"></head>
<body class="native-shell">
<header id="app-header">
  <div class="window-brand"><button id="browse-back" type="button" aria-label="返回上一页" title="返回上一页（Esc）" disabled>←</button><img class="brand-mark" src="../assets/app-icon.png" alt="" width="21" height="21"><span class="app-name">Music 下载器</span><button id="nav-toggle" aria-label="展开侧边栏" aria-expanded="false" title="切换侧边栏"><span data-icon="sidebar"></span></button></div>
  <div class="app-header-right"><button id="download-monitor" aria-label="查看下载进度"><span class="monitor-icon" data-icon="download"></span><span class="monitor-copy"><strong id="monitor-title">下载状态</strong><span id="monitor-detail">正在连接下载服务…</span></span><span id="monitor-speed">—</span><progress id="monitor-progress" max="1" value="0" aria-label="当前任务曲目进度"></progress></button><select id="region" aria-label="目录地区"><option value="us">美国</option><option value="cn">中国大陆</option><option value="hk">香港</option><option value="tw">台湾</option><option value="jp">日本</option><option value="gb">英国</option></select><button id="refresh-catalog" aria-label="刷新当前目录" title="刷新目录"><span data-icon="refresh"></span></button></div>
</header>
<aside id="sidebar">
  <button id="sidebar-search-toggle" aria-label="展开搜索" title="搜索"><span data-icon="search"></span></button>
  <form id="search-form" role="search"><input id="search-input" type="search" placeholder="搜索" aria-label="搜索 Apple Music"><button type="submit" aria-label="搜索"><span data-icon="search"></span></button></form>
  <div class="sidebar-scroll"><nav aria-label="主导航">
    <button data-feed="home" aria-label="主页推荐" class="selected" aria-current="page"><span data-icon="home"></span><span class="nav-label">主页</span></button>
    <button data-feed="discover" aria-label="新发现"><span data-icon="grid"></span><span class="nav-label">新发现</span></button>
    <button data-feed="library" aria-label="我的歌单"><span data-icon="library"></span><span class="nav-label">我的歌单</span></button>
    <span class="sidebar-section nav-label">下载与管理</span>
    <button data-view="tasks" aria-label="下载任务"><span data-icon="download"></span><span class="nav-label">下载任务</span><span id="sidebar-job-count" class="nav-count" hidden></span></button>
    <button data-view="settings" aria-label="设置与状态"><span data-icon="settings"></span><span class="nav-label">设置与状态</span></button>
  </nav><details id="sidebar-library" open><summary>播放列表</summary><div id="sidebar-playlists"></div></details></div>
  <button id="session-light" class="session-light" aria-label="查看登录与状态"><span class="dot"></span><span class="nav-label"><strong>账号与服务</strong><small id="sidebar-session">正在恢复会话</small></span></button>
</aside>
<main class="native-content"><div id="compact-search" hidden></div><header class="native-toolbar"><h1 id="page-title">主页</h1></header>
<p id="notice" role="status"></p><section id="browse-view"><div id="catalog-content"></div><button id="catalog-more" hidden>加载更多</button></section>
<section id="tasks-view" hidden><form id="manual-form" class="manual-form"><input id="manual-url" type="url" placeholder="粘贴 Apple Music 歌曲、专辑或歌单链接" required><button type="submit" class="primary">加入任务</button></form><p id="jobs-status" role="status"></p><div id="jobs"></div></section>
<section id="settings-view" hidden><section class="settings-group"><h2>账号与服务</h2><div class="setting-row"><div><h3 id="account-state">正在验证会话</h3><p id="runtime-state">Windows 原生服务</p></div><button id="open-login">登录</button><button id="recheck">重新验证</button></div><div class="setting-row"><span>诊断日志</span><button id="export-log">导出诊断</button></div><div class="setting-row"><span>交流 QQ 群</span><span id="qq-group" title="交流与反馈群号，可直接选中复制">1131277036</span></div></section>
<section class="settings-group"><h2>下载</h2><div class="setting-row download-directory-row"><div><h3>下载位置</h3><p id="download-directory"></p></div><button id="choose-download-directory">选择文件夹</button></div><p id="directory-feedback" role="status"></p><div class="setting-grid"><label>默认音质<select id="quality"><option value="alac" selected>ALAC 无损</option><option value="aac-lc">AAC-LC</option><option value="atmos">Dolby Atmos</option></select></label><label>已有文件<select id="existing"><option value="skip">跳过</option><option value="overwrite">覆盖</option><option value="fail">报告冲突</option></select></label><label>并行下载<input id="concurrency" type="number" min="1" max="8" value="3"></label></div><div id="preference-fields" class="setting-grid"></div><div class="filename-builder"><h3>单曲文件名</h3><input id="filename" aria-label="单曲文件名模板"><div id="filename-tokens"></div></div><div class="setting-row"><button id="save-settings" class="primary">保存设置</button><button id="reset-settings">恢复默认</button></div></section><section class="settings-group"><h2>缓存与预加载</h2><p id="cache-usage">正在读取缓存占用…</p><div class="setting-row"><label>缓存上限（MB）<input id="cache-limit" type="number" min="0" max="10240" step="50" value="500"></label><button id="save-cache-limit">调整容量</button><button id="clear-cache">清理缓存</button></div><p id="cache-feedback" role="status"></p></section></section>
</main><footer id="player" hidden><div><strong id="player-title"></strong><span id="player-status"></span></div><audio id="audio" controls preload="none"></audio><button id="stop-playback" aria-label="停止播放">✕</button></footer><script src="native-stream.js"></script><script src="native-motion.js"></script><script src="native-renderer.js"></script></body></html>
