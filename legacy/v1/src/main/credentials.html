<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>配置凭据</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #202124; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 8px; }
    .hint { color: #5f6368; font-size: .9rem; margin: 4px 0; }
    footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
    #result { min-height: 1.5em; color: #137333; }
  </style>
</head>
<body>
  <h1>WSL Appliance 凭据</h1>
  <p class="hint">这些值只保存在 Windows DPAPI 加密存储中，并通过一次性 stdin 交给专用 WSL 服务；不会写入 .env、日志或进程命令行。留空的密码或 Token 会保留已保存的值。</p>
  <form id="credentials-form">
    <label for="apple-email">Apple ID 邮箱</label>
    <input id="apple-email" type="email" autocomplete="username">
    <label for="apple-password">Apple ID 密码</label>
    <input id="apple-password" type="password" autocomplete="current-password" placeholder="留空以保留">
    <label for="media-token">Media User Token</label>
    <input id="media-token" type="password" autocomplete="off" placeholder="留空以保留">
    <label for="authorization-token">Authorization Token</label>
    <input id="authorization-token" type="password" autocomplete="off" placeholder="留空以保留">
    <label for="storefront">Storefront</label>
    <input id="storefront" type="text" autocomplete="off" placeholder="例如 us">
    <p id="result" role="status"></p>
    <footer><button type="submit">保存</button></footer>
  </form>
  <script src="credentials.js"></script>
</body>
</html>
