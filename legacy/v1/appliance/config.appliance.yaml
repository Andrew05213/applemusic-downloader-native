# Appliance-only configuration. Secrets are deliberately absent and are
# delivered to the supervisor/backend over inherited file descriptors.
storefront: us
language: ""
alac-save-folder: /srv/applemusic-downloader/downloads/ALAC
atmos-save-folder: /srv/applemusic-downloader/downloads/Atmos
aac-save-folder: /srv/applemusic-downloader/downloads/AAC
decrypt-m3u8-port: 127.0.0.1:10020
get-m3u8-port: 127.0.0.1:20020
get-m3u8-from-device: true
aac-type: aac-lc
alac-max: 192000
atmos-max: 2768
limit-max: 200
mv-max: 2160
