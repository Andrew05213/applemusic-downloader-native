name: Native Cloud Release

on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: 'Create a NEW draft after build, audit and packaged smoke (never replace tags/assets)'
        type: boolean
        default: false
      public_release:
        description: 'Explicit public distribution mode; does not grant third-party rights'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-private-release
  cancel-in-progress: false

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'
  GOTOOLCHAIN: local

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
  guest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      guest_receipt_sha256: ${{ steps.build.outputs.guest_receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: apple-music-downloader/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build locked toolchain and compile current guest without accounts
        id: build
        run: node electron/native-cloud-release.js linux
      - name: Transfer only pristine guest and source/hash evidence to this run
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-cloud-guest
          path: |
            .artifacts/cloud-guest/guest
            .artifacts/cloud-guest/notices
            .artifacts/cloud-guest/evidence
            .artifacts/cloud-guest/guest-export.json
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
  installer:
    needs: [verify, guest]
    runs-on: windows-2025
    timeout-minutes: 45
    environment: native-private-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      AMDL_GUEST_RECEIPT_SHA256: ${{ needs.guest.outputs.guest_receipt_sha256 }}
      AMDL_CREATE_DRAFT: ${{ inputs.create_draft }}
      AMDL_PUBLIC_RELEASE: ${{ inputs.public_release && '1' || '0' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: apple-music-downloader/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.guest.outputs.artifact_id }}
          path: .artifacts/cloud-guest
          merge-multiple: true
      - name: Verify same-commit guest, assemble QEMU, build/audit NSIS and smoke isolated app
        shell: powershell
        run: ./electron/native-ci-windows.ps1 -CloudRelease
      # Draft is the only Release write. Public promotion is a separate review.
      # No image/NDK, account, profile or downloaded music is uploaded.
