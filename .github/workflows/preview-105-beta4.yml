name: Native Preview 1.0.5-beta.4

on:
  push:
    branches: ['codex/auth-diagnostics-1.0.5-beta.4']

# This branch workflow builds and audits artifacts only. Releases are created
# separately after confirming the output digests and target commit.
permissions:
  contents: read

concurrency:
  group: native-token-diagnostics-105-beta4
  cancel-in-progress: true

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'
  GOTOOLCHAIN: local

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      guest_receipt_sha256: ${{ steps.build.outputs.guest_receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: apple-music-downloader/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Compile locked guest from source
        id: build
        run: node electron/native-cloud-release.js linux
      - name: Transfer guest and build evidence to the Windows job
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-cloud-guest
          path: |
            .artifacts/cloud-guest/guest
            .artifacts/cloud-guest/notices
            .artifacts/cloud-guest/evidence
            .artifacts/cloud-guest/guest-export.json
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
  installer:
    needs: [verify, guest]
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      AMDL_GUEST_RECEIPT_SHA256: ${{ needs.guest.outputs.guest_receipt_sha256 }}
      AMDL_CREATE_DRAFT: 'false'
      AMDL_PUBLIC_RELEASE: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: apple-music-downloader/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.guest.outputs.artifact_id }}
          path: .artifacts/cloud-guest
          merge-multiple: true
      - name: Assemble, audit and run the packaged installer payload in isolation
        shell: powershell
        run: ./electron/native-ci-windows.ps1 -CloudRelease
      - name: Upload only verified installer, checksum and build result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-beta4-installer
          path: |
            .artifacts/installers/**/AppleMusicDownloader-1.0.5-beta.4-Setup.exe
            .artifacts/installers/**/AppleMusicDownloader-1.0.5-beta.4-Setup.exe.sha256
            .artifacts/cloud-release-result.json
          retention-days: 7
          if-no-files-found: error
